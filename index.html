<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChantierAI — Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --green:#43A047; --dark:#37474F; --grey:#90A4AE; --accent:#FFC107;
    --bg:#F5F5F5; --border:#E0E0E0;
    --actif:#43A047; --suspendu:#FF9800; --refuse:#E53935; --envoye:#1E88E5;
    --text-pdf:#17181A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--dark);}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;position:relative;}
  header{background:var(--green);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;position:relative;}
  header .back{cursor:pointer;background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  header .back:hover{background:rgba(255,255,255,.28);}
  header .back:active{background:rgba(255,255,255,.4);}
  header h1{font-size:17px;margin:0;flex:1;text-align:center;padding-right:28px;}
  header .icon-btn{position:absolute;right:14px;top:16px;font-size:20px;cursor:pointer;background:none;border:none;color:#fff;}
  main{flex:1;padding:18px;overflow-y:auto;padding-bottom:90px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .logo-block{text-align:center;margin-bottom:2px;}
  .logo-cube{width:70px;height:70px;margin:0 auto 8px;background:linear-gradient(135deg,#FFC107,#43A047);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;}
  label{display:block;font-size:12px;color:var(--grey);margin-bottom:4px;margin-top:12px;}
  input[type=text], input[type=email], input[type=password], input[type=number], textarea, select{
    width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--dark);
  }
  textarea{resize:vertical;min-height:60px;}
  .field-with-mic{position:relative;}
  .toggle-pwd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--grey);display:flex;align-items:center;padding:2px;}
  .toggle-pwd:hover{color:var(--dark);}
  .pwd-wrap{position:relative;}
  .pwd-wrap input{padding-right:38px;}
  .mic-btn{position:absolute;right:8px;top:32px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--grey);}
  .mic-btn.recording{color:var(--refuse);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;text-align:center;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-warning{background:var(--accent);color:var(--dark);}
  .btn-danger{background:var(--refuse);color:#fff;}
  .btn-outline{background:#fff;color:var(--dark);border:1px solid var(--border);}
  .btn-grey{background:#ECEFF1;color:var(--dark);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  .status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;color:#fff;display:inline-block;}
  .status.Actif{background:var(--actif);} .status.Suspendu{background:var(--suspendu);}
  .status.Refusé{background:var(--refuse);} .status.Envoyé{background:var(--envoye);}
  .project-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .project-item:last-child{border-bottom:none;}
  .project-item .name{font-weight:600;} .project-item .addr{font-size:12px;color:var(--grey);}
  .photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photo-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
  .tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:14px;}
  .tab{flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--grey);font-weight:600;}
  .tab.active{color:var(--dark);border-bottom:2px solid var(--green);margin-bottom:-2px;}
  .center{text-align:center;}
  .muted{color:var(--grey);font-size:13px;}
  .spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;max-width:380px;text-align:center;}
  .pdf-preview{background:#fff;border:1px solid var(--border);padding:16px;font-size:13px;color:var(--text-pdf);border-top:4px solid var(--dark);}
  .pdf-preview h2{font-size:16px;margin:0 0 2px;}
  .pdf-preview .meta{font-size:11px;color:var(--grey);margin-bottom:10px;}
  .dest-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .dest-row input{flex:1;}
  .dest-row button{background:none;border:none;color:var(--refuse);font-size:16px;cursor:pointer;}
  .badge-sim{background:#FFF3CD;color:#7A5B00;font-size:11px;padding:8px 10px;border-radius:6px;margin-bottom:10px;}
  .login-frame{border:1px solid var(--border);border-radius:16px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .badge-ok{background:#E6F4EA;color:#1E7B34;font-size:11px;padding:8px 10px;border-radius:6px;margin-bottom:10px;}
  .field-icon{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:12px;}
  .field-icon input{border:none;padding:0;flex:1;}
  .field-icon .ic{color:var(--grey);}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:1000;}
  .sheet{background:#fff;width:100%;max-width:430px;border-radius:16px 16px 0 0;padding:18px;}
  .sheet .btn{margin-top:10px;}
  .list-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .list-item:last-child{border-bottom:none;}
  .list-item .t{font-weight:600;} .list-item .d{font-size:12px;color:var(--grey);}
</style>
</head>

/* ================= SUPABASE REST + AUTH HELPERS ================= */
let lastDbError = "";
function authHeaders(){
  return { apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${state.accessToken || SUPABASE_ANON_KEY}` };
}
async function sbSelect(table, query=""){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`,{ headers: authHeaders() });
    if(!res.ok){ lastDbError = `SELECT ${table}: ${res.status} — ${await res.text()}`; throw new Error(lastDbError); }
    return await res.json();
  }catch(e){ lastDbError = e.message || String(e); console.warn(lastDbError); return null; }
}
async function sbInsert(table, row){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{
      method:"POST",
      headers:{ ...authHeaders(), "Content-Type":"application/json", Prefer:"return=representation" },
      body: JSON.stringify(row)
    });
    if(!res.ok){ lastDbError = `INSERT ${table}: ${res.status} — ${await res.text()}`; throw new Error(lastDbError); }
    return await res.json();
  }catch(e){ lastDbError = e.message || String(e); console.warn(lastDbError); return null; }
}
async function sbUpdate(table, matchQuery, row){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${matchQuery}`,{
      method:"PATCH",
      headers:{ ...authHeaders(), "Content-Type":"application/json", Prefer:"return=representation" },
      body: JSON.stringify(row)
    });
    if(!res.ok){ lastDbError = `UPDATE ${table}: ${res.status} — ${await res.text()}`; throw new Error(lastDbError); }
    return await res.json();
  }catch(e){ lastDbError = e.message || String(e); console.warn(lastDbError); return null; }
}

async function sbInsertGetId(table, row){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{
      method:"POST",
      headers:{ ...authHeaders(), "Content-Type":"application/json", Prefer:"return=minimal" },
      body: JSON.stringify(row)
    });
    if(!res.ok){ lastDbError = `INSERT ${table}: ${res.status} — ${await res.text()}`; console.warn(lastDbError); return null; }
    const loc = res.headers.get("Location") || "";
    const m = loc.match(/id=eq\.(\d+)/);
    return m ? parseInt(m[1], 10) : null;
  }catch(e){ lastDbError = e.message || String(e); console.warn(lastDbError); return null; }
}

/* ---- Auth réelle Supabase (signup / login) ---- */
async function sbSignUp(email, password){
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`,{
      method:"POST",
      headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ lastDbError = `SIGNUP: ${res.status} — ${JSON.stringify(data)}`; return { error: data.msg || data.error_description || lastDbError }; }
    const token = data.access_token || data.session?.access_token || null;
    return { user: data.user || data, accessToken: token };
  }catch(e){ return { error: e.message || String(e) }; }
}
async function sbSignIn(email, password){
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:"POST",
      headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ lastDbError = `LOGIN: ${res.status} — ${JSON.stringify(data)}`; return { error: data.msg || data.error_description || lastDbError }; }
    const token = data.access_token || data.session?.access_token || null;
    return { user: data.user || data.session?.user, accessToken: token };
  }catch(e){ return { error: e.message || String(e) }; }
}

/* ================= IA via Edge Function Supabase (OpenAI côté serveur) ================= */
async function genererRapportIA(form){
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/generer-rapport-ia`, {
      method:"POST",
      headers:{ ...authHeaders(), "Content-Type":"application/json" },
      body: JSON.stringify({
        titre: form.titre, description: form.description, observations: form.observations,
        visiteurs: form.visiteurs, epi: form.epi, meteo: form.meteo, nb_travailleurs: form.nb_travailleurs,
        photos: form.photos.map(p=>({ base64:p.base64, mediaType:p.mediaType }))
      })
    });
    const data = await res.json();
    if(!res.ok || data.error){ return { texte: `⚠ ERREUR Edge Function (${res.status}):\n${data.error || JSON.stringify(data)}`, photoSections: [] }; }
    const fullText = data.contenu || "";
    const [reportPart, jsonPart] = fullText.split("---PHOTOS---");
    let photoSections = [];
    if(jsonPart){
      try{ photoSections = JSON.parse(jsonPart.trim()); }catch(e){ console.warn("JSON photoSections invalide", e); }
    }
    return { texte: (reportPart||fullText).trim(), photoSections };
  }catch(e){
    return { texte: `⚠ ERREUR RÉSEAU:\n${e.message || e}`, photoSections: [] };
  }
}

async function transcrireAudio(audioBlob){
  const base64 = await new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(audioBlob);
  });
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/transcrire-audio`, {
      method:"POST",
      headers:{ ...authHeaders(), "Content-Type":"application/json" },
      body: JSON.stringify({ audioBase64: base64, mimeType: audioBlob.type })
    });
    const data = await res.json();
    if(!res.ok || data.error){ showToast("Erreur transcription: " + (data.error||res.status)); return ""; }
    return data.texte || "";
  }catch(e){
    showToast("Erreur réseau transcription: " + (e.message||e));
    return "";
  }
}

/* ================= ENREGISTREMENT AUDIO (Whisper via Edge Function) ================= */
let mediaRecorder = null;
let audioChunks = [];
let recordingField = null;
async function toggleMic(fieldKey, btnEl){
  if(mediaRecorder && recordingField === fieldKey){
    mediaRecorder.stop();
    return;
  }
  if(mediaRecorder){ mediaRecorder.stop(); }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    recordingField = fieldKey;
    btnEl.classList.add("recording");
    mediaRecorder.ondataavailable = (e)=> audioChunks.push(e.data);
    mediaRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      recordingField = null; render();
      showToast("Transcription en cours...");
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const texte = await transcrireAudio(blob);
      if(texte){
        state.rapportForm[fieldKey] = (state.rapportForm[fieldKey] ? state.rapportForm[fieldKey]+" " : "") + texte;
        render();
      }
    };
    mediaRecorder.start();
    render();
  }catch(e){
    showToast("Micro inaccessible: " + (e.message || e));
  }
}

  const input = document.getElementById(id);
  if(!input) return;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btnEl.innerHTML = showing ? EYE_OPEN_SVG : EYE_OFF_SVG;
}

function showToast(msg){
  const t = document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function go(view){ state.view = view; state.modal = null; render(); }

async function chargerEspaceUtilisateur(){
  // Récupère (ou crée) la ligne Utilisateurs liée à ce compte Auth, puis son entreprise et ses projets
  const users = await sbSelect("Utilisateurs", `select=*&auth_id=eq.${state.authUser.id}`);
  let profil = users && users[0];
  if(!profil){
    // Aucun profil encore: on le crée sans entreprise (le champ entreprise_id du client reste vide,
    // même si la colonne a une valeur par défaut côté DB — on ne s'y fie jamais aveuglément, voir plus bas)
    const inserted = await sbInsert("Utilisateurs", { nom: state.authUser.user_metadata?.nom || state.authUser.email, email: state.authUser.email, role:"Administrateur", actif:true, auth_id: state.authUser.id });
    profil = inserted && inserted[0];
  }
  state.user = profil ? { nom: profil.nom, courriel: profil.email, id: profil.id, entreprise_id: profil.entreprise_id } : { nom: state.authUser.email, courriel: state.authUser.email };

  // Important: on ne fait JAMAIS confiance à entreprise_id seul (la colonne a une valeur par défaut
  // héritée qui peut pointer vers une entreprise inexistante). On vérifie qu'elle existe vraiment.
  let entrepriseValide = false;
  if(state.user.entreprise_id){
    const ent = await sbSelect("Entreprises", `select=*&id=eq.${state.user.entreprise_id}`);
    if(ent && ent[0]){
      state.entreprise = ent[0];
      if(!state.entreprise.roles) state.entreprise.roles = ["Employé","Gestionnaire","Administrateur"];
      entrepriseValide = true;
    }else{
      // entreprise_id invalide (orpheline) — on nettoie côté client ET côté base pour ne plus retomber dessus
      state.user.entreprise_id = null;
      await sbUpdate("Utilisateurs", `id=eq.${state.user.id}`, { entreprise_id: null });
    }
  }

  const tp = await sbSelect("Types_projets", "select=*&limit=50");
  state.typesProjets = tp || [];

  if(entrepriseValide){
    const projets = await sbSelect("Projets", `select=*&entreprise_id=eq.${state.user.entreprise_id}`);
    state.projets = projets || [];
    const rapports = await sbSelect("Rapports", `select=*&entreprise_id=eq.${state.user.entreprise_id}`);
    state.rapports = rapports || [];
    state.dbStatus = projets ? "ok" : "fallback";
    go("mesProjets");
  }else{
    // Pas encore d'entreprise: on force l'onboarding
    state.onboardingForm = { nom_entreprise:"", numero_rbq:"", adresse:"", email: state.authUser.email||"", contact_urgence:"", logoBase64:null, logoMimeType:null };
    go("onboardingEtape1");
  }
}

async function annulerInvitation(id){
  if(!confirm("Annuler cette invitation ?")) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/Invitations?id=eq.${id}`, {
    method:"DELETE",
    headers: authHeaders()
  });
  if(!res.ok){
    showToast("Impossible d'annuler l'invitation: " + (await res.text()));
    return;
  }
  await chargerInvitations();
  render();
}

async function inviterMembre(){
  const emailEl = document.getElementById("ge-invite-email");
  const roleEl = document.getElementById("ge-invite-role");
  const btnEl = document.getElementById("ge-invite-btn");
  if(!emailEl || !roleEl) return;
  const email = emailEl.value.trim();
  const role = roleEl.value;
  if(!email || !email.includes("@")){ showToast("Un courriel valide est requis."); return; }
  if(!state.entreprise || !state.entreprise.id){ showToast("Erreur: entreprise introuvable."); return; }
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = "Envoi en cours..."; }
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/invite-user`, {
      method:"POST",
      headers:{ ...authHeaders(), "Content-Type":"application/json" },
      body: JSON.stringify({ email, role, entreprise_id: state.entreprise.id })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.error){
      showToast("Échec de l'invitation: " + (data.error || `erreur ${res.status}`));
      return;
    }
    showToast(`Invitation envoyée à ${email}`);
    emailEl.value = "";
    await chargerInvitations();
    render();
  }catch(e){
    showToast("Erreur réseau lors de l'invitation: " + (e.message||e));
  }finally{
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = "Inviter un membre"; }
  }
}

function detecterInvitation(){
  if(!window.location.hash || !window.location.hash.includes("access_token")) return null;
  const params = new URLSearchParams(window.location.hash.substring(1));
  if(params.get("type") !== "invite") return null;
  const access_token = params.get("access_token");
  if(!access_token) return null;
  return { access_token };
}

async function accepterInvitation(){
  const p1 = document.getElementById("ai-mdp");
  const p2 = document.getElementById("ai-mdp2");
  const btnEl = document.getElementById("ai-confirmer");
  if(!p1 || !p2) return;
  const mdp = p1.value;
  const mdp2 = p2.value;
  if(!mdp || mdp.length < 6){ showToast("Le mot de passe doit contenir au moins 6 caractères."); return; }
  if(mdp !== mdp2){ showToast("Les mots de passe ne correspondent pas."); return; }
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = "Création en cours..."; }
  try{
    // 1) Définit le mot de passe du compte invité
    const resPwd = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method:"PUT",
      headers:{ ...authHeaders(), "Content-Type":"application/json" },
      body: JSON.stringify({ password: mdp })
    });
    const dataPwd = await resPwd.json().catch(()=>({}));
    if(!resPwd.ok){
      showToast("Impossible de définir le mot de passe: " + (dataPwd.msg || dataPwd.error_description || resPwd.status));
      return;
    }
    state.authUser = dataPwd;

    // 2) Crée le profil Utilisateurs rattaché directement à l'entreprise et au rôle de l'invitation
    const inv = state.invitationData;
    const inserted = await sbInsert("Utilisateurs", {
      nom: inv.email, email: inv.email, role: inv.role, actif: true,
      auth_id: state.authUser.id, entreprise_id: inv.entreprise_id
    });
    if(!inserted || !inserted[0]){
      showToast("Erreur: le profil n'a pas pu être enregistré dans Supabase (" + lastDbError + "). L'inscription est bloquée, réessaie.");
      return;
    }

    // 3) Marque l'invitation comme acceptée, par son identifiant précis (pas par email,
    // qui pourrait correspondre à plusieurs invitations). On le signale si ça échoue,
    // au lieu de le laisser passer silencieusement.
    if(inv.invitation_id){
      const majInvitation = await sbUpdate("Invitations", `id=eq.${inv.invitation_id}`, { statut:"acceptee" });
      if(!majInvitation || !majInvitation[0]){
        showToast("⚠ Le compte a été créé, mais le statut de l'invitation n'a pas pu être mis à jour (" + lastDbError + ").");
      }
    }

    sauvegarderSession();
    await chargerEspaceUtilisateur();
  }catch(e){
    showToast("Erreur réseau: " + (e.message||e));
  }finally{
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = "Créer mon compte"; }
  }
}

function sauvegarderSession(){
  try{
    localStorage.setItem("chantierai_session", JSON.stringify({ accessToken: state.accessToken, authUser: state.authUser }));
  }catch(e){ console.warn("Impossible de sauvegarder la session:", e); }
}
function effacerSession(){
  try{ localStorage.removeItem("chantierai_session"); }catch(e){}
}
function chargerSessionSauvegardee(){
  try{
    const raw = localStorage.getItem("chantierai_session");
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

async function seConnecter(nom, courriel, mdp){
  const result = await sbSignIn(courriel, mdp);
  if(result.error){ showToast("Connexion échouée: " + result.error); return; }
  state.accessToken = result.accessToken;
  state.authUser = result.user;
  sauvegarderSession();
  await chargerEspaceUtilisateur();
}

async function commencerCreationCompte(nom, courriel, mdp){
  const result = await sbSignUp(courriel, mdp);
  if(result.error){ showToast("Inscription échouée: " + result.error); return; }
  state.accessToken = result.accessToken;
  state.authUser = result.user;
  // Certaines configurations Supabase ne renvoient pas de session directement à l'inscription,
  // même quand la confirmation par courriel est désactivée. On force une vraie connexion pour obtenir un jeton valide.
  if(!state.accessToken){
    const loginResult = await sbSignIn(courriel, mdp);
    if(loginResult.error){
      showToast("Compte créé, mais connexion automatique échouée: " + loginResult.error + " — vérifie si la confirmation par courriel est requise sur ton projet Supabase.");
      return;
    }
    state.accessToken = loginResult.accessToken;
    state.authUser = loginResult.user || state.authUser;
  }
  sauvegarderSession();
  state.onboardingForm = { nom_entreprise:"", numero_rbq:"", adresse:"", email: courriel||"", contact_urgence:"", logoBase64:null, logoMimeType:null };
  const inserted = await sbInsert("Utilisateurs", { nom: nom, email: courriel, role:"Administrateur", actif:true, auth_id: state.authUser?.id });
  const profil = inserted && inserted[0];
  if(!profil){
    showToast("Attention: profil utilisateur non enregistré dans Supabase (" + lastDbError + "). L'onboarding va continuer mais certaines actions échoueront.");
  }
  state.user = profil
    ? { nom: profil.nom, courriel: profil.email, id: profil.id, entreprise_id: profil.entreprise_id }
    : { nom, courriel, entreprise_id: null };
  go("onboardingEtape1");
}

async function terminerOnboarding(){
  const row = {
    nom_entreprise: state.onboardingForm.nom_entreprise,
    numero_rbq: state.onboardingForm.numero_rbq,
    adresse_siege: state.onboardingForm.adresse,
    email_facturation: state.onboardingForm.email,
    contact_urgence: state.onboardingForm.contact_urgence,
    logo_url: null, // téléversé séparément (Storage) — non branché dans ce prototype
    approbation_requise: state.approbationActive
  };
  const inserted = await sbInsert("Entreprises", row);
  const entreprise = inserted && inserted[0];

  if(!entreprise){
    // On bloque : pas d'entreprise fantôme en mode local, on force à corriger la connexion.
    showToast("⚠ Échec de l'enregistrement dans Supabase : " + lastDbError + " — corrige la connexion avant de continuer.");
    return;
  }

  state.entreprise = { ...entreprise, roles:["Employé","Gestionnaire","Administrateur"], logoBase64: state.onboardingForm.logoBase64, logoMimeType: state.onboardingForm.logoMimeType };
  if(state.user?.id){
    await sbUpdate("Utilisateurs", `id=eq.${state.user.id}`, { entreprise_id: entreprise.id });
    state.user.entreprise_id = entreprise.id;
  }
  state.dbStatus = "ok";

  const tp = await sbSelect("Types_projets", "select=*&limit=50");
  state.typesProjets = tp || [];
  state.projets = [];
  go("mesProjets");
}

  const nom = input.value.trim();
  if(!nom){ showToast("Nom du rôle requis."); return; }
  if(!state.entreprise.roles) state.entreprise.roles = [];
  if(state.entreprise.roles.includes(nom)){ showToast("Ce rôle existe déjà."); return; }
  state.entreprise.roles.push(nom);
  render();
}

}

async function approuverRapport(){
  if(typeof state.currentProjetId === "string" && state.currentProjetId.startsWith("local-")){
    showToast("Ce projet n'a pas été enregistré dans Supabase (créé en mode secours). Le rapport ne peut pas être lié à un vrai projet. Recrée le projet une fois la connexion rétablie.");
    return;
  }
  // 1. Créer d'abord la saisie terrain brute (Entrees_terrain)
  const entreeRow = {
    date_entree: new Date().toISOString().slice(0,10),
    meteo: state.rapportForm.meteo,
    temperature: null,
    non_conformites: state.rapportForm.observations,
    sst: state.rapportForm.epi,
    notes: state.rapportForm.description,
    photo_url: null, // Storage non branché dans ce prototype
    projet_id: state.currentProjetId,
    utilisateur_id: state.user?.id || null
  };
  const entreeInserted = await sbInsert("Entrees_terrain", entreeRow);
  if(!entreeInserted || !entreeInserted[0]){
    showToast("⚠ Échec de l'enregistrement dans Supabase : " + lastDbError + " — le rapport n'a pas été approuvé.");
    return;
  }
  const entreeId = entreeInserted[0].id;

  // 2. Créer le rapport, qui référence cette entrée terrain
  const row = {
    entree_terrain_id: entreeId,
    projet_id: state.currentProjetId,
    entreprise_id: state.user?.entreprise_id || null,
    utilisateur_id: state.user?.id || null,
    titre: state.rapportForm.titre,
    description: state.rapportForm.description,
    observations: state.rapportForm.observations,
    meteo: state.rapportForm.meteo,
    nb_travailleurs: state.rapportForm.nb_travailleurs ? parseInt(state.rapportForm.nb_travailleurs) : null,
    visiteurs: state.rapportForm.visiteurs,
    epi: state.rapportForm.epi,
    statut_rapport: "Approuvé",
    contenu_ia: state.contenuGenere,
    date_rapport: new Date().toISOString().slice(0,10)
  };
  const inserted = await sbInsert("Rapports", row);
  if(!inserted || !inserted[0]){
    showToast("⚠ Échec de l'enregistrement dans Supabase : " + lastDbError + " — le rapport n'a pas été approuvé.");
    return;
  }
  const finalRow = inserted[0];
  state.currentRapportId = finalRow.id;
  state.rapports.push(finalRow);
  state.dbStatus = "ok";
  go("pdfPreview");
}

function genererPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const form = state.rapportForm;
  const SECTIONS = ["Résumé","Travaux effectués","Observations","Sécurité et EPI","Conditions et main-d'œuvre"];

  doc.setFont("helvetica","bold"); doc.setFontSize(14);
  doc.text(form.titre || "Rapport de chantier", 15, 18);
  doc.setDrawColor(23,24,26); doc.setLineWidth(0.5); doc.line(15,22,195,22);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text(`Date: ${new Date().toLocaleDateString('fr-CA')}   Météo: ${form.meteo||"-"}   Travailleurs: ${form.nb_travailleurs||"-"}`, 15, 28);

  // Découper le texte généré en sections, à partir des titres "## "
  const raw = state.contenuGenere || "";
  const sectionTexts = {};
  const regex = /##\s*(Résumé|Travaux effectués|Observations|Sécurité et EPI|Conditions et main-d'œuvre)\s*\n([\s\S]*?)(?=##\s*(?:Résumé|Travaux effectués|Observations|Sécurité et EPI|Conditions et main-d'œuvre)|$)/g;
  let match, foundAny = false;
  while((match = regex.exec(raw)) !== null){
    sectionTexts[match[1].trim()] = match[2].trim();
    foundAny = true;
  }
  if(!foundAny){ sectionTexts["__brut__"] = raw; }

  const photosBySection = {};
  (state.photoSections||[]).forEach(ps=>{
    const idx = ps.photo - 1;
    if(form.photos[idx]){
      if(!photosBySection[ps.section]) photosBySection[ps.section] = [];
      photosBySection[ps.section].push(form.photos[idx]);
    }
  });
  const usedPhotoIdx = new Set((state.photoSections||[]).map(ps=>ps.photo-1));

  let y = 38;
  const pageBottom = 275;
  function ensureSpace(needed){
    if(y + needed > pageBottom){ doc.addPage(); y = 20; }
  }
  function addImageBlock(photo, caption){
    ensureSpace(90);
    doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(100);
    doc.text(caption, 15, y); y += 4;
    try{ doc.addImage(`data:${photo.mediaType};base64,${photo.base64}`, undefined, 15, y, 120, 80, undefined, "FAST"); }catch(e){}
    y += 86;
    doc.setTextColor(23,24,26);
  }

  const sectionsToRender = foundAny ? SECTIONS : ["__brut__"];
  sectionsToRender.forEach(sec=>{
    const text = sectionTexts[sec];
    if(text === undefined) return;
    ensureSpace(16);
    if(sec !== "__brut__"){
      doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(67,160,71);
      doc.text(sec, 15, y); y += 6;
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(23,24,26);
    const lines = doc.splitTextToSize(text, 180);
    lines.forEach(line=>{ ensureSpace(6); doc.text(line, 15, y); y += 6; });
    y += 4;
    (photosBySection[sec]||[]).forEach((photo, i)=> addImageBlock(photo, `Photo — ${sec}`));
  });

  // Photos non rattachées à une section précise (ou si l'IA n'a pas fourni de mapping)
  form.photos.forEach((p, idx)=>{
    if(!usedPhotoIdx.has(idx)) addImageBlock(p, `Photo ${idx+1} — annexe`);
  });

  doc.setFontSize(8); doc.setTextColor(150);
  doc.text("Généré via ChantierAI (prototype)", 15, 292);
  doc.save(`rapport-${(form.titre||"chantier").replace(/\s+/g,'-')}.pdf`);
}

function envoyerSimule(){ showToast("Envoi simulé — Resend n'est pas encore branché."); go("mesProjets"); }

function ouvrirRapport(id){
  const r = state.rapports.find(x=>String(x.id)===String(id));
  if(!r) return;
  state.currentRapportId = id;
  state.currentProjetId = r.projet_id;
  state.contenuGenere = r.contenu_ia || "";
  state.rapportForm = { titre:r.titre||"", description:r.description||"", observations:r.observations||"", visiteurs:r.visiteurs||"", epi:r.epi||"", meteo:r.meteo||"", nb_travailleurs:r.nb_travailleurs||"", photos:[] };
  go("pdfPreview");
}

function modifierStatutProjet(nouveauStatut){
  const p = state.projets.find(p=>String(p.id)===String(state.currentProjetId));
  if(p) p.statut_projet = nouveauStatut;
  sbUpdate("Projets", `id=eq.${state.currentProjetId}`, { statut_projet: nouveauStatut });
  state.modal = null; render();
}

/* ================= RENDU ================= */
function render(){
  const app = document.getElementById("app");
  document.querySelectorAll(".sheet-overlay").forEach(el=>el.remove());
  app.innerHTML = "";
  const el = document.createElement("div");

  if(state.view==="accueil") el.innerHTML = renderAccueil();
  else if(state.view==="mesProjets") el.innerHTML = renderMesProjets();
  else if(state.view==="ajouterProjet") el.innerHTML = renderAjouterProjet();
  else if(state.view==="detailProjet") el.innerHTML = renderDetailProjet();
  else if(state.view==="listeRapports") el.innerHTML = renderListeRapports();
  else if(state.view==="gestionEntreprise") el.innerHTML = renderGestionEntreprise();
  else if(state.view==="creerRapport") el.innerHTML = renderCreerRapport();
  else if(state.view==="generationIA") el.innerHTML = renderGenerationIA();
  else if(state.view==="approbationRapport") el.innerHTML = renderApprobationRapport();
  else if(state.view==="pdfPreview") el.innerHTML = renderPdfPreview();
  else if(state.view==="envoiPDF") el.innerHTML = renderEnvoiPDF();
  else if(state.view==="onboardingEtape1") el.innerHTML = renderOnboarding1();
  else if(state.view==="onboardingEtape2") el.innerHTML = renderOnboarding2();
  else if(state.view==="onboardingEtape3") el.innerHTML = renderOnboarding3();
  else if(state.view==="accepterInvitation") el.innerHTML = renderAccepterInvitation();

  app.appendChild(el);

  if(state.modal==="modifierStatut"){
    const overlay = document.createElement("div");
    overlay.className="sheet-overlay";
    overlay.innerHTML = `<div class="sheet">
      <button class="btn btn-primary" onclick="modifierStatutProjet('Actif')">Actif</button>
      <button class="btn btn-warning" onclick="modifierStatutProjet('Suspendu')">Suspendu</button>
      <button class="btn btn-danger" onclick="modifierStatutProjet('Refusé')">Refusé</button>
      <button class="btn btn-grey" onclick="state.modal=null;render()">Annuler</button>
    </div>`;
    overlay.onclick = (e)=>{ if(e.target===overlay){ state.modal=null; render(); } };
    document.body.appendChild(overlay);
  }
  if(state.modal==="ajouterDestinataire"){
    const overlay = document.createElement("div");
    overlay.className="sheet-overlay";
    overlay.innerHTML = `<div class="sheet">
      <h3 style="margin-top:0;">Ajouter un destinataire</h3>
      <label>Email *</label>
      <input type="text" id="ad-email" placeholder="ex: directeur@entreprise.com">
      <label>Nom (optionnel)</label>
      <input type="text" id="ad-nom" placeholder="ex: Jean Tremblay">
      <div class="row" style="margin-top:14px;">
        <button class="btn btn-warning" onclick="state.modal=null;render()">Annuler</button>
        <button class="btn btn-primary" id="ad-confirmer">Confirmer</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById("ad-confirmer").onclick = ()=>{
      const email = document.getElementById("ad-email").value;
      const nomDest = document.getElementById("ad-nom").value;
      if(!email){ showToast("Email requis."); return; }
      if(state.destinataires[state.destinataires.length-1]==="") state.destinataires.pop();
      state.destinataires.push(email);
      sbInsert("Destinataires", { email, nom: nomDest||null, projet_id: state.currentProjetId, entreprise_id: state.user?.entreprise_id||null });
      state.modal=null; render();
    };
  }

  attachHandlers();
}

  const backSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<header>${back?`<button class="back" onclick="${back}">${backSvg}</button>`:""}<h1>${title}</h1>${iconBtn?`<button class="icon-btn" onclick="${iconBtn}">👤</button>`:""}</header>`;
}

  <div style="height:8px;background:#ECEFF1;"><div style="height:8px;width:66%;background:var(--accent);"></div></div>
  <main>
    <p class="muted center">Étape 2 sur 3 — Confirmation de votre entreprise</p>
    <div class="center" style="margin:14px 0;">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;">✓</div>
      <p style="font-weight:600;color:var(--green);">Votre entreprise est créée !</p>
      <p class="muted">Retrouvez et modifiez vos informations dans Mon entreprise</p>
    </div>
    <div class="card">
      <div class="field-icon"><span class="ic">🏢</span><input type="text" value="${f.nom_entreprise}" readonly></div>
      <div class="field-icon"><span class="ic">🪪</span><input type="text" value="${f.numero_rbq}" readonly></div>
      <div class="field-icon"><span class="ic">📍</span><input type="text" value="${f.adresse}" readonly></div>
      <div class="field-icon"><span class="ic">✉️</span><input type="text" value="${f.email}" readonly></div>
      <div class="field-icon"><span class="ic">📞</span><input type="text" value="${f.contact_urgence}" readonly></div>

}

function renderOnboarding3(){
  return `
  ${header("Créer mon entreprise")}
  <div style="height:8px;background:#ECEFF1;"><div style="height:8px;width:100%;background:var(--accent);"></div></div>
  <main>
    <p class="muted center">Étape 3 sur 3 — Paramètres d'approbation</p>
    <p>L'approbation permet de soumettre chaque rapport à un membre désigné avant envoi au client.</p>

      <div>Activer l'approbation</div>

  const inv = state.invitationData || {};
  const pwdIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>`;
  return `
  ${header("Rejoindre l'entreprise")}
  <main style="padding-top:14px;">
    <div class="logo-block">
      <img src="data:image/png;base64,${state.logoBase64}" style="width:150px;height:auto;margin:0 auto;display:block;">
    </div>
    <p class="muted center">Tu as été invité(e) à rejoindre <strong>${escapeHtml(inv.entreprise_nom||"l'entreprise")}</strong> en tant que <strong>${escapeHtml(inv.role||"")}</strong>.</p>
    <label>Courriel</label>
    <input type="text" value="${escapeHtml(inv.email||"")}" disabled>
    <label>Choisis un mot de passe *</label>
    <div class="pwd-wrap"><input type="password" id="ai-mdp" placeholder="Mot de passe">
      <button type="button" class="toggle-pwd" onclick="togglePwd('ai-mdp', this)">${pwdIcon}</button></div>
    <label>Confirme le mot de passe *</label>
    <div class="pwd-wrap"><input type="password" id="ai-mdp2" placeholder="Confirmer le mot de passe">
      <button type="button" class="toggle-pwd" onclick="togglePwd('ai-mdp2', this)">${pwdIcon}</button></div>
    <button class="btn btn-primary" id="ai-confirmer" onclick="accepterInvitation()">Créer mon compte</button>
  </main>`;
}

function dbBadge(){
  if(state.dbStatus==="ok") return `<div class="badge-ok">✓ Enregistré dans Supabase</div>`;
  if(state.dbStatus==="fallback") return `<div class="badge-sim">⚠ Supabase indisponible — sauvegardé localement pour ce test seulement.<br><span style="font-family:monospace;font-size:10px;">${escapeHtml(lastDbError)}</span></div>`;
  return "";
}
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatRapportAffichage(s){ return escapeHtml(s).replace(/^## (.+)$/gm, '<strong style="color:var(--green)">$1</strong>'); }

function attachHandlers(){
  const b1 = document.getElementById("btn-connexion");
  if(b1) b1.onclick = ()=>{
    const nom = document.getElementById("acc-nom") ? document.getElementById("acc-nom").value.trim() : "";
    const courriel = document.getElementById("acc-courriel").value.trim();
    const mdp = document.getElementById("acc-mdp") ? document.getElementById("acc-mdp").value : "";
    if(state.authTab==='inscription'){
      const mdp2 = document.getElementById("acc-mdp2") ? document.getElementById("acc-mdp2").value : "";
      if(!nom){ showToast("Le nom complet est requis."); return; }
      if(!courriel || !courriel.includes("@")){ showToast("Un courriel valide est requis."); return; }
      if(!mdp || mdp.length < 6){ showToast("Le mot de passe doit contenir au moins 6 caractères."); return; }
      if(mdp !== mdp2){ showToast("Les mots de passe ne correspondent pas."); return; }
      commencerCreationCompte(nom, courriel, mdp);
    }else{
      if(!courriel || !courriel.includes("@")){ showToast("Un courriel valide est requis."); return; }
      if(!mdp){ showToast("Le mot de passe est requis."); return; }
      seConnecter(nom, courriel, mdp);
    }
  };
  const b2 = document.getElementById("btn-creer-projet");
  if(b2) b2.onclick = ()=>{
    const nom = document.getElementById("np-nom").value;
    const adresse = document.getElementById("np-adresse").value;
    const type = document.getElementById("np-type").value;
    const desc = document.getElementById("np-desc").value;
    if(!nom || !adresse){ showToast("Nom et adresse sont requis."); return; }
    creerProjet(nom, adresse, type || null, desc);
  };
  const p = document.getElementById("rf-photos");
  if(p) p.onchange = (e)=> ajouterPhotos(e.target.files);
  const champIds = { titre:"rf-titre", description:"rf-description", observations:"rf-observations", visiteurs:"rf-visiteurs", epi:"rf-epi", meteo:"rf-meteo", nb_travailleurs:"rf-nb" };
  Object.keys(champIds).forEach(k=>{
    const elm = document.getElementById(champIds[k]);
    if(elm) elm.oninput = (e)=> state.rapportForm[k]=e.target.value;
  });
  const bg = document.getElementById("btn-generer");
  if(bg) bg.onclick = ()=>{ if(!state.rapportForm.titre){ showToast("Le titre est requis."); return; } genererRapport(); };
  const ba = document.getElementById("btn-approuver"); if(ba) ba.onclick = approuverRapport;
  const br = document.getElementById("btn-regenerer"); if(br) br.onclick = genererRapport;
  const baf = document.getElementById("btn-approuver-final"); if(baf) baf.onclick = approuverRapport;
  const bt = document.getElementById("btn-telecharger"); if(bt) bt.onclick = genererPDF;
  const be = document.getElementById("btn-envoyer"); if(be) be.onclick = envoyerSimule;
  const logoInput = document.getElementById("ob-logo-upload");
  if(logoInput) logoInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const b64 = await fileToBase64(file);
    state.onboardingForm.logoBase64 = b64;
    state.onboardingForm.logoMimeType = file.type;
    render();
  };
  const bo1 = document.getElementById("btn-onboarding1");
  if(bo1) bo1.onclick = ()=>{
    const nom = document.getElementById("ob-nom").value;
    const rbq = document.getElementById("ob-rbq").value;
    if(!nom || !rbq){ showToast("Nom de l'entreprise et numéro RBQ sont requis."); return; }
    state.onboardingForm = {
      ...state.onboardingForm,
      nom_entreprise: nom, numero_rbq: rbq,
      adresse: document.getElementById("ob-adresse").value,
      email: document.getElementById("ob-email").value,
      contact_urgence: document.getElementById("ob-urgence").value
    };
    go("onboardingEtape2");
  };
  const bt3 = document.getElementById("btn-terminer-onboarding");
  if(bt3) bt3.onclick = ()=>{
    const chk = document.getElementById("ob-approbation");
    state.approbationActive = chk ? chk.checked : false;
    terminerOnboarding();
  };
  const bge = document.getElementById("btn-enregistrer-entreprise");
  if(bge) bge.onclick = enregistrerEntreprise;
}

/* ================= DÉMARRAGE ================= */
(async function demarrer(){
  const invite = detecterInvitation();
  if(invite && invite.access_token){
    history.replaceState(null, "", window.location.pathname); // nettoie le token de l'URL
    state.accessToken = invite.access_token;
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: authHeaders() });
    if(res.ok){
      const u = await res.json();
      state.authUser = u;
      state.invitationData = {
        email: u.email,
        role: u.user_metadata?.role || "Employé",
        entreprise_id: u.user_metadata?.entreprise_id || null,
        entreprise_nom: u.user_metadata?.entreprise_nom || "",
        invitation_id: u.user_metadata?.invitation_id || null
      };
      state.view = "accepterInvitation";
      render();
      return;
    }else{
      state.accessToken = null;
      showToast("Lien d'invitation invalide ou expiré.");
    }
  }
  const session = chargerSessionSauvegardee();
  if(session && session.accessToken && session.authUser){
    state.accessToken = session.accessToken;
    state.authUser = session.authUser;
    render(); // affiche un écran vide pendant la vérification
    const test = await sbSelect("Utilisateurs", `select=id&auth_id=eq.${state.authUser.id}&limit=1`);
    if(test !== null){
      await chargerEspaceUtilisateur();
      return;
    }else{
      effacerSession();
      state.accessToken = null;
      state.authUser = null;
    }
  }
  render();
})();
</script>
